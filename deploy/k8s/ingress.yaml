apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recipe-ingress
  namespace: recipe-book
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - recipes.example.com
      secretName: recipe-tls-cert
  rules:
    - host: recipes.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: recipe-backend
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: recipe-backend
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: recipe-backend
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: recipe-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recipe-frontend
                port:
                  number: 80
