apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-frontend
  namespace: recipe-book
  labels:
    app.kubernetes.io/name: recipe-frontend
    app.kubernetes.io/part-of: recipe-book
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: recipe-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recipe-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-username/recipe-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: recipe-frontend
  namespace: recipe-book
spec:
  selector:
    app.kubernetes.io/name: recipe-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
