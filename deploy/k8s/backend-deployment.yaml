apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-backend
  namespace: recipe-book
  labels:
    app.kubernetes.io/name: recipe-backend
    app.kubernetes.io/part-of: recipe-book
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: recipe-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recipe-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: ghcr.io/your-username/recipe-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: recipe-book-config
            - secretRef:
                name: recipe-book-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8000
            failureThreshold: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recipe-backend
  namespace: recipe-book
spec:
  selector:
    app.kubernetes.io/name: recipe-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
