[project]
name = "recipe-book-backend"
version = "0.1.0"
description = "FastAPI backend for Recipe Book with MongoDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "motor>=3.6.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9.0",
    "google-auth>=2.30.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "mongomock-motor>=0.0.30",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
# Pyflakes + core pycodestyle errors, plus bugbear for likely bugs
select = ["E4", "E7", "E9", "F", "B"]
# FastAPI's Depends()/Query() defaults are intentional
ignore = ["B008"]
