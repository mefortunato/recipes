name: Deploy

# Every push to main runs the full CI suite, then builds the production image,
# pushes it to Artifact Registry and deploys it to Cloud Run.
# One-time GCP/GitHub setup: ./scripts/setup-github-deploy.sh (see README).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation (no JSON keys)
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE: ${{ vars.GCP_SERVICE_NAME || 'recipe-book' }}
      AR_REPO: ${{ vars.GCP_ARTIFACT_REPO || 'cloud-run-source-deploy' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=0
          for name in PROJECT_ID WIF_PROVIDER DEPLOY_SA MONGODB_URI; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not configured for the production environment."
              missing=1
            fi
          done
          if [ ${#JWT_SECRET} -lt 32 ]; then
            echo "::error::Secret JWT_SECRET must be a random value of at least 32 characters (openssl rand -hex 32)."
            missing=1
          fi
          exit $missing

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Set image name
        run: echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve public URL
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            FRONTEND_URL="https://${CUSTOM_DOMAIN}"
          fi
          if [ -n "$FRONTEND_URL" ] && [[ "$FRONTEND_URL" != http* ]]; then
            FRONTEND_URL="https://${FRONTEND_URL}"
          fi
          FRONTEND_URL="${FRONTEND_URL%/}"
          if [ -z "$FRONTEND_URL" ]; then
            # Fall back to the existing Cloud Run URL (empty on the very first deploy)
            FRONTEND_URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
              --format 'value(status.url)' 2>/dev/null || true)
          fi
          echo "FRONTEND_URL=${FRONTEND_URL}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ALLOWED_EDITOR_EMAILS: ${{ vars.ALLOWED_EDITOR_EMAILS }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME || 'recipe_book' }}
          AUTO_SEED: ${{ vars.AUTO_SEED || 'true' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
        run: |
          # An env-vars file (JSON is valid YAML) keeps values with commas, such as
          # ALLOWED_EDITOR_EMAILS, intact; --set-env-vars would split them.
          ENV_FILE="${RUNNER_TEMP}/cloud-run-env.yaml"
          python3 - "$ENV_FILE" <<'EOF'
          import json, os, sys
          env = {
              "GCP_PROJECT_ID": os.environ["PROJECT_ID"],
              "ENVIRONMENT": "production",
              "LOG_FORMAT": "json",
          }
          for key in ("MONGODB_URI", "MONGODB_DB_NAME", "AUTO_SEED", "LOG_LEVEL", "JWT_SECRET",
                      "ALLOWED_EDITOR_EMAILS", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "FRONTEND_URL"):
              value = os.environ.get(key, "")
              if value or key == "ALLOWED_EDITOR_EMAILS":
                  env[key] = value
          with open(sys.argv[1], "w") as f:
              json.dump(env, f)
          EOF

          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --env-vars-file "$ENV_FILE" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --quiet
          rm -f "$ENV_FILE"

          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --format 'value(status.url)')

          # First deploy: the URL only exists now, so point FRONTEND_URL (CORS/OAuth) at it.
          if [ -z "$FRONTEND_URL" ]; then
            gcloud run services update "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
              --update-env-vars "FRONTEND_URL=${SERVICE_URL}" --quiet
            FRONTEND_URL="$SERVICE_URL"
          fi

          echo "url=${FRONTEND_URL}" >> "$GITHUB_OUTPUT"
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
        run: |
          # /health/ready also pings MongoDB, so this catches a bad MONGODB_URI or Atlas IP list.
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "${SERVICE_URL}/health/ready"
          echo
          {
            echo "### Deployed to Cloud Run"
            echo ""
            echo "- App: ${{ steps.deploy.outputs.url }}"
            echo "- Service URL: ${SERVICE_URL}"
            echo "- Image: \`${IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
