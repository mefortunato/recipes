services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe-book-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8000"
    environment:
      - ENVIRONMENT=development
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-recipe_book}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - AUTO_SEED=true
      - LOG_LEVEL=INFO
      - LOG_FORMAT=text
      - CORS_ORIGINS=["http://localhost:8080","http://localhost:5173","http://localhost:8000","*"]
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: recipe-book-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=recipe_book
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Optional MongoDB Web GUI Admin (run with: docker compose --profile tools up)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: recipe-book-mongo-express
    profiles:
      - tools
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
    name: recipe_book_mongo_data
